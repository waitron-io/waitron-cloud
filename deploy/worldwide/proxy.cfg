global
  maxconn 200
  log stdout format raw local0
  ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
  mode http
  timeout connect 5s
  timeout client 15s
  timeout server 15s

frontend console_https
  bind :8443 ssl crt /run/console/tls.pem
  http-request deny deny_status 403 unless { req.hdr_cnt(host) eq 1 }
  acl apex req.hdr(host) -m str "${APEX_HOST-waitron.io}"
  acl console req.hdr(host) -m str "${CONSOLE_HOST-console.waitron.io}"
  http-request deny deny_status 403 unless apex or console
  http-request return status 302 hdr Location https://es.waitron.io/ if apex { path -m str / }
  http-request deny deny_status 404 if apex
  http-request deny deny_status 403 if { req.hdr_cnt(origin) gt 1 }
  http-request deny deny_status 403 if { req.hdr_cnt(origin) gt 0 } !{ req.hdr(origin) -m str "${CONSOLE_ORIGIN-https://console.waitron.io}" }
  http-request del-header forwarded
  http-request del-header x-forwarded-for
  http-request del-header x-forwarded-host
  http-request del-header x-forwarded-proto
  http-request del-header x-forwarded-port
  http-request del-header x-real-ip
  http-request set-header x-forwarded-for %[src]
  http-request set-header x-forwarded-proto https
  default_backend console_api

backend console_api
  server api 127.0.0.1:3000 check
