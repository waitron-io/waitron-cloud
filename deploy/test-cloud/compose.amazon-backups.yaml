# Select only for the Amazon test Cloud with the exact verifier image loaded.
services:
  bootstrap:
    environment:
      CLOUD_TEST_AMAZON_BACKUPS: "1"
  account:
    environment:
      CLOUD_TEST_AMAZON_BACKUPS: "1"
  proxy:
    environment:
      CLOUD_TEST_AMAZON_BACKUPS: "1"
  backup-worker:
    profiles: !reset []
    mem_limit: 144m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      TEST_CLOUD_AMAZON: "1"
      CLOUD_TEST_AMAZON_BACKUPS: "1"
      CLOUD_VERIFIER_IMAGE: ${CLOUD_VERIFIER_IMAGE:?Set the immutable Amazon test verifier image ID}
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
        bind:
          create_host_path: false
