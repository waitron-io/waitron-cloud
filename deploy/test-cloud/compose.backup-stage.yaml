# Add this overlay only after creating both private, bounded staging filesystems.
services:
  account:
    environment:
      CLOUD_BACKUP_STAGE_ROOT: /run/backup-stage
      CLOUD_EXIT_STAGE_ROOT: /run/backup-stage
    volumes:
      - type: bind
        source: ${TEST_CLOUD_ACCOUNT_BACKUP_STAGE:?Set the account's bounded backup stage path}
        target: /run/backup-stage
        bind:
          create_host_path: false
  backup-worker:
    environment:
      CLOUD_BACKUP_STAGE_ROOT: /run/backup-stage
    volumes:
      - type: bind
        source: ${LOCAL_BACKUP_WORKER_STAGE:?Set the worker's bounded backup stage path}
        target: /run/backup-stage
        bind:
          create_host_path: false
