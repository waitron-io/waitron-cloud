frontend amazon_tls
  mode tcp
  timeout client 60s
  bind :443
  tcp-request inspect-delay 5s
  tcp-request content reject if { req.ssl_hello_type 1 } !{ req.ssl_sni -m found }
  tcp-request content accept if { req.ssl_hello_type 1 }
  use_backend amazon_account if { req.ssl_sni -m str "${TEST_CLOUD_HOST}" }
  .if defined(TEST_CLOUD_GUEST_HOST)
  use_backend amazon_account if { req.ssl_sni -m str "${TEST_CLOUD_GUEST_HOST-disabled.invalid}" }
  .endif
  default_backend amazon_gateway

backend amazon_account
  mode tcp
  server account 127.0.0.1:3443 send-proxy-v2

backend amazon_gateway
  mode tcp
  timeout server 60s
  server gateway gateway:443 send-proxy-v2 resolvers amazon_docker init-addr none

frontend amazon_account_https
  bind 127.0.0.1:3443 accept-proxy ssl crt "${TEST_CLOUD_CERTIFICATE}"
  acl account_sni ssl_fc_sni -m str "${TEST_CLOUD_HOST}"
  acl account_host req.hdr(host) -m str "${TEST_CLOUD_HOST}"
  http-request deny deny_status 403 unless { req.hdr_cnt(host) eq 1 }
  .if defined(TEST_CLOUD_GUEST_HOST)
  acl guest_sni ssl_fc_sni -m str "${TEST_CLOUD_GUEST_HOST-disabled.invalid}"
  acl guest_host req.hdr(host) -m str "${TEST_CLOUD_GUEST_HOST-disabled.invalid}"
  http-request deny deny_status 403 unless account_sni account_host or guest_sni guest_host
  use_backend amazon_guest if guest_sni guest_host
  .else
  http-request deny deny_status 403 unless account_sni account_host
  .endif
  default_backend account

.if defined(TEST_CLOUD_GUEST_HOST)
backend amazon_guest
  http-request del-header forwarded
  http-request del-header x-forwarded-host
  http-request del-header x-forwarded-proto
  http-request del-header x-forwarded-port
  http-request del-header x-real-ip
  http-request set-header x-forwarded-for %[src]
  server guest 10.79.0.3:3443 ssl verify required ca-file "${TEST_CLOUD_GUEST_CA}" verifyhost waitron.local sni str(waitron.local)
.endif

resolvers amazon_docker
  nameserver docker 127.0.0.11:53
  timeout resolve 1s
  timeout retry 1s
  hold valid 1s
  hold nx 1s
