global
  maxconn 200
  log stdout format raw local0
  ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
  mode http
  timeout connect 5s
  timeout client 15s
  timeout server 15s

frontend account_https
  bind :3000 ssl crt "${TEST_CLOUD_CERTIFICATE-/run/local-stack/lan/proxy.pem}"
  default_backend account

backend account
  http-request deny deny_status 403 unless { req.hdr_cnt(host) eq 1 }
  http-request deny deny_status 403 unless { req.hdr(host) -m str "${TEST_CLOUD_HOST-waitron.local:3000}" }
  http-request deny deny_status 403 if { req.hdr_cnt(origin) gt 1 }
  http-request deny deny_status 403 if { req.hdr_cnt(origin) gt 0 } !{ req.hdr(origin) -m str "${TEST_CLOUD_ORIGIN-https://waitron.local:3000}" }
  http-request del-header forwarded
  http-request del-header x-forwarded-for
  http-request del-header x-forwarded-host
  http-request del-header x-forwarded-proto
  http-request del-header x-forwarded-port
  http-request del-header x-real-ip
  http-request set-header x-forwarded-for %[src]
  http-request set-header x-forwarded-proto https
  server account account:3000 check
  http-request set-timeout server 50s if METH_POST { path /api/installations/backup-publish }
