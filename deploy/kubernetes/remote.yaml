{
  "apiVersion": "v1",
  "kind": "List",
  "items": [
    {"apiVersion": "v1", "kind": "Secret", "metadata": {"name": "remote-routes"}, "stringData": {"routes.json": "{\"certificates\":{}}"}},
    {"apiVersion": "coordination.k8s.io/v1", "kind": "Lease", "metadata": {"name": "remote-gateway"}, "spec": {}},
    {"apiVersion": "v1", "kind": "ServiceAccount", "metadata": {"name": "remote-worker"}},
    {"apiVersion": "v1", "kind": "ServiceAccount", "metadata": {"name": "remote-gateway"}},
    {"apiVersion": "rbac.authorization.k8s.io/v1", "kind": "Role", "metadata": {"name": "remote-worker"},
      "rules": [{"apiGroups": [""], "resources": ["secrets"], "resourceNames": ["remote-routes"], "verbs": ["get", "update"]}]},
    {"apiVersion": "rbac.authorization.k8s.io/v1", "kind": "Role", "metadata": {"name": "remote-gateway"},
      "rules": [{"apiGroups": ["coordination.k8s.io"], "resources": ["leases"], "resourceNames": ["remote-gateway"], "verbs": ["get", "update"]}]},
    {"apiVersion": "rbac.authorization.k8s.io/v1", "kind": "RoleBinding", "metadata": {"name": "remote-worker"},
      "roleRef": {"apiGroup": "rbac.authorization.k8s.io", "kind": "Role", "name": "remote-worker"},
      "subjects": [{"kind": "ServiceAccount", "name": "remote-worker"}]},
    {"apiVersion": "rbac.authorization.k8s.io/v1", "kind": "RoleBinding", "metadata": {"name": "remote-gateway"},
      "roleRef": {"apiGroup": "rbac.authorization.k8s.io", "kind": "Role", "name": "remote-gateway"},
      "subjects": [{"kind": "ServiceAccount", "name": "remote-gateway"}]},
    {"apiVersion": "v1", "kind": "Service", "metadata": {"name": "remote-gateway"},
      "spec": {"type": "NodePort", "selector": {"app": "remote-gateway"}, "ports": [
        {"name": "staff-and-public", "port": 443, "targetPort": 443, "nodePort": 30443},
        {"name": "wireguard", "port": 51820, "targetPort": 51820, "nodePort": 31820, "protocol": "UDP"}
      ]}},
    {"apiVersion": "apps/v1", "kind": "Deployment", "metadata": {"name": "remote-gateway"},
      "spec": {"replicas": 3, "selector": {"matchLabels": {"app": "remote-gateway"}},
        "template": {"metadata": {"labels": {"app": "remote-gateway"}}, "spec": {
          "serviceAccountName": "remote-gateway",
          "volumes": [
            {"name": "state", "emptyDir": {}},
            {"name": "identity", "secret": {"secretName": "remote-gateway-identity", "defaultMode": 384}},
            {"name": "routes", "secret": {"secretName": "remote-routes", "defaultMode": 384}}
          ],
          "containers": [{"name": "gateway", "image": "CLOUD_IMAGE", "imagePullPolicy": "Never", "workingDir": "/app",
            "command": ["sh", "-ec", "mkdir -p /state/certs; cp /identity/default.pem /state/certs/; exec node deploy/kubernetes/gateway-supervisor.mjs"],
            "securityContext": {"capabilities": {"add": ["NET_ADMIN"]}, "allowPrivilegeEscalation": false},
            "env": [
              {"name": "GATEWAY_CELL_ID", "value": "CELL_ID"},
              {"name": "GATEWAY_SUBNET", "value": "61"},
              {"name": "GATEWAY_TRUST_KEY", "value": "/identity/issuer.pem"},
              {"name": "GATEWAY_WIREGUARD_KEY", "value": "/identity/wireguard.key"},
              {"name": "GATEWAY_BOT_KEY", "value": "/identity/bot.key"},
              {"name": "GATEWAY_UPSTREAM_CA", "value": "/identity/ca.pem"},
              {"name": "GATEWAY_ARTIFACT_BUNDLE", "value": "/routes/routes.json"},
              {"name": "GATEWAY_PUBLIC_CERTIFICATES", "value": "/state/certs"}
            ],
            "volumeMounts": [
              {"name": "state", "mountPath": "/state"},
              {"name": "identity", "mountPath": "/identity", "readOnly": true},
              {"name": "routes", "mountPath": "/routes", "readOnly": true}
            ],
            "resources": {"limits": {"memory": "240Mi"}},
            "readinessProbe": {"exec": {"command": ["sh", "-ec", "test -f /state/lease-active && node deploy/test-cloud/gateway-health.mjs"]}, "periodSeconds": 1, "failureThreshold": 1}
          }]
        }}
      }
    }
  ]
}
