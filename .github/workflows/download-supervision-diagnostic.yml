name: Download supervision diagnostics
on:
  pull_request:
    paths:
      - 'scripts/ci-download*'
      - 'scripts/fixtures/ci-download-linux.py'
      - 'scripts/fixtures/ci_download_events.py'
      - '.github/workflows/download-supervision-diagnostic.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/ci-download*'
      - 'scripts/fixtures/ci-download-linux.py'
      - 'scripts/fixtures/ci_download_events.py'
      - '.github/workflows/download-supervision-diagnostic.yml'
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      mode: ${{ steps.plan.outputs.mode }}
      required: ${{ steps.plan.outputs.required }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          package-manager-cache: false
      - id: plan
        run: node scripts/ci-native-plan.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_FORCE_FULL: ${{ inputs.full }}
          CI_WORKFLOW_INPUTS: ${{ toJSON(inputs) }}
          CI_RECORD_EVIDENCE: 'true'
          CI_WORKFLOW_PATH: .github/workflows/download-supervision-diagnostic.yml
      - name: Retain source plan
        if: steps.plan.outputs.source_artifact != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.plan.outputs.source_artifact }}
          path: .ci-evidence/source/plan.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Retain main decision
        if: steps.plan.outputs.decision_artifact != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.plan.outputs.decision_artifact }}
          path: .ci-evidence/decision/plan.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  linux-contention:
    needs: changes
    if: needs.changes.outputs.required == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exercise stale ownership under bounded CPU contention
        run: |
          set -o pipefail
          mkdir -p diagnostics
          python3 -u - <<'PY' | tee diagnostics/native-linux.log
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import json, os, subprocess, sys, time
          # Restrict only this job's children, making launch contention repeatable.
          os.sched_setaffinity(0, {min(os.sched_getaffinity(0))})
          print(json.dumps({'affinity_cpus': sorted(os.sched_getaffinity(0))}))
          def run(index):
              start = time.monotonic()
              try:
                  result = subprocess.run([
                      sys.executable, 'scripts/fixtures/ci-download-linux.py',
                      'scripts/ci-download.py', 'stale',
                  ], env={**os.environ, 'CI_DOWNLOAD_REPORT_PROGRESS': '1'},
                      capture_output=True, text=True, timeout=15)
              except subprocess.TimeoutExpired as error:
                  def text(value):
                      return value.decode('utf-8', errors='replace') if isinstance(value, bytes) else value or ''
                  result = subprocess.CompletedProcess(error.cmd, 124,
                      stdout=text(error.stdout), stderr=text(error.stderr) + '\nCase exceeded 15 seconds\n')
              return index, time.monotonic() - start, result
          failures = 0
          with ThreadPoolExecutor(max_workers=8) as workers:
              for task in as_completed([workers.submit(run, n) for n in range(32)]):
                  index, elapsed, result = task.result()
                  print(json.dumps({'case': index, 'seconds': elapsed, 'exit': result.returncode}))
                  print(result.stdout, end='')
                  print(result.stderr, end='')
                  failures += result.returncode != 0
          print(json.dumps({'cases': 32, 'failures': failures}))
          raise SystemExit(bool(failures))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: download-supervision-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}
          path: diagnostics/
          retention-days: 14
  summary:
    if: ${{ always() }}
    needs: [changes, linux-contention]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          package-manager-cache: false
      - run: node scripts/ci-native-summary.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_PLAN: ${{ needs.changes.outputs.plan }}
          CI_RESULTS: ${{ toJSON(needs) }}
          CI_JOB_PREFIX: ${{ inputs.job-prefix }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_WORKFLOW_INPUTS: ${{ toJSON(inputs) }}
          CI_WORKFLOW_PATH: .github/workflows/download-supervision-diagnostic.yml
