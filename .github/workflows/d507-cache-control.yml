name: D507 cache boundary control
on:
  push:
    branches: [fix/cost-cache-save-bound]
    paths: [.github/workflows/d507-cache-control.yml]
permissions:
  contents: read
jobs:
  control:
    name: cache control (${{ matrix.mode }})
    runs-on: ubuntu-latest
    timeout-minutes: 2
    strategy:
      fail-fast: false
      matrix:
        mode: [healthy, stalled, failed-test]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          package-manager-cache: false
      - run: node scripts/ci-setup-pnpm.mjs
      - id: store
        run: |
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
          mkdir -p "$(pnpm store path --silent)"
          echo d507-owned-sentinel > "$(pnpm store path --silent)/d507-sentinel"
      - name: Mandatory test outcome
        run: |
          if [ '${{ matrix.mode }}' = failed-test ]; then exit 37; fi
      - name: Block archive creation inside the real cache-save action
        if: matrix.mode == 'stalled'
        run: |
          mkdir -p "$RUNNER_TEMP/d507-bin"
          cat > "$RUNNER_TEMP/d507-bin/tar" <<'SH'
          #!/bin/bash
          if [[ "$*" == *--version* ]]; then exec /usr/bin/tar "$@"; fi
          echo "$$" > "$RUNNER_TEMP/d507-tar.pid"
          echo D507_CACHE_SAVE_ENTERED_BLOCKED_ARCHIVE
          trap 'exit 143' TERM INT
          while true; do sleep 1; done
          SH
          chmod +x "$RUNNER_TEMP/d507-bin/tar"
          echo "$RUNNER_TEMP/d507-bin" >> "$GITHUB_PATH"
      - name: Save pnpm dependency cache
        id: save
        uses: actions/cache/save@v4
        with:
          path: ${{ steps.store.outputs.path }}
          key: d507-control-${{ github.run_id }}-${{ matrix.mode }}
      - name: Remove only the owned sentinel before restoring
        if: matrix.mode == 'healthy'
        run: rm '${{ steps.store.outputs.path }}/d507-sentinel'
      - id: restore
        if: matrix.mode == 'healthy'
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.store.outputs.path }}
          key: d507-control-${{ github.run_id }}-${{ matrix.mode }}
          fail-on-cache-miss: true
      - name: Verify healthy restore or bounded save cleanup
        env:
          MODE: ${{ matrix.mode }}
          SAVE_OUTCOME: ${{ steps.save.outcome }}
          SAVE_CONCLUSION: ${{ steps.save.conclusion }}
          RESTORE_HIT: ${{ steps.restore.outputs.cache-hit }}
          STORE_PATH: ${{ steps.store.outputs.path }}
        run: |
          if [ "$MODE" = healthy ]; then
            test "$SAVE_OUTCOME" = success
            test "$RESTORE_HIT" = true
            test "$(cat "$STORE_PATH/d507-sentinel")" = d507-owned-sentinel
            echo D507_HEALTHY_SAVE_RESTORE_PASS
          else
            test "$SAVE_OUTCOME" = failure
            test "$SAVE_CONCLUSION" = success
            pid=$(cat "$RUNNER_TEMP/d507-tar.pid")
            if kill -0 "$pid" 2>/dev/null; then echo "Owned archive process still alive: $pid"; exit 1; fi
            echo D507_STALLED_SAVE_BOUNDED_AND_CLEANED
          fi
