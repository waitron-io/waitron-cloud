name: Shared UI release
on:
  pull_request:
    paths:
      - 'scripts/release/**'
      - '.github/workflows/ui-release.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ui-release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Read pinned source
        id: source
        run: node -e 'const fs = require("node:fs"); const s = JSON.parse(fs.readFileSync("scripts/release/ui-source.json")); if (!/^[a-f0-9]{40}$/.test(s.commit)) throw Error("Unpinned source"); fs.appendFileSync(process.env.GITHUB_OUTPUT, `commit=${s.commit}\n`);'
      - uses: actions/checkout@v5
        with:
          repository: clintongormley/waitron
          ref: ${{ steps.source.outputs.commit }}
          path: .release-source
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          package-manager-cache: false
      - run: node scripts/ci-setup-pnpm.mjs
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci-pnpm-diagnostics.cjs
          npm_config_fetch_timeout: '15000'
          npm_config_fetch_retries: '1'
          npm_config_fetch_retry_mintimeout: '1000'
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Locate pnpm dependency store
        id: pnpm-store
        # The cache version must not depend on the bootstrap's random binary path.
        run: |
          export npm_config_store_dir="$RUNNER_TEMP/cloud-pnpm-store"
          echo "npm_config_store_dir=$npm_config_store_dir" >> "$GITHUB_ENV"
          echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm dependency cache
        id: pnpm-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-node26-${{ hashFiles('.release-source/pnpm-lock.yaml') }}
      - run: node --test scripts/release/*.test.mjs
      - run: pnpm --dir .release-source install --frozen-lockfile
      - run: pnpm --dir .release-source --filter @waitron/ui-core exec playwright install --with-deps chromium
      - run: pnpm --dir .release-source --filter @waitron/ui-core test:package
      - run: node scripts/release/prepare-ui.mjs .release-source ui-release
      - name: Check publication without uploading
        run: npm publish ./ui-release/*.tgz --dry-run --registry=https://npm.pkg.github.com --access=restricted --ignore-scripts
      - uses: actions/upload-artifact@v4
        with:
          name: ui-package
          path: ui-release/*.tgz
          if-no-files-found: error
          retention-days: 7
      # Cache publication is optional; a stalled save must not cancel completed tests.
      - name: Save pnpm dependency cache
        if: success() && steps.pnpm-cache.outputs.cache-hit != 'true'
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ui-package
          path: ui-release
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          registry-url: https://npm.pkg.github.com
          scope: '@waitron-io'
      - run: npm publish ./ui-release/*.tgz --registry=https://npm.pkg.github.com --access=restricted --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
