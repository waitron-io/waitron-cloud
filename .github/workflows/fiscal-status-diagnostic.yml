name: Fiscal status authority checks
on:
  pull_request:
    paths:
      - 'packages/fiscal-allocation/src/store.ts'
      - 'packages/fiscal-allocation/test/store.test.ts'
      - '.github/workflows/fiscal-status-diagnostic.yml'
permissions:
  contents: read
  packages: read
jobs:
  linux-status-authority:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci-pnpm-diagnostics.cjs
          npm_config_fetch_timeout: '15000'
          npm_config_fetch_retries: '1'
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@waitron-io'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Prove status checks and catch omitted authority
        run: |
          mkdir -p diagnostics
          node scripts/test-postgres.mjs exec python3 -u - <<'PYTHON'
          from pathlib import Path
          import subprocess, re, json
          source = Path('packages/fiscal-allocation/src/store.ts')
          original = source.read_text()
          def run(label):
              result = subprocess.run(['node', '--test', '--test-reporter=tap', '--test-timeout=30000',
                  '--test-name-pattern=^stored status ', 'packages/fiscal-allocation/test/store.test.ts'],
                  capture_output=True, text=True, timeout=150)
              output = result.stdout + result.stderr
              Path('diagnostics/' + label + '.log').write_text(output)
              print(json.dumps({'case': label, 'exit': result.returncode}), flush=True)
              print(output, flush=True)
              return result.returncode, output
          code, output = run('baseline')
          assert code == 0, 'baseline status checks must pass before faults'
          target = "      await this.#authorize(c, token, csrf, input.venueId, scope, 'read');\n      return { version: 1, state: 'recorded', receipt };"
          assert original.count(target) == 1
          faults = [
              ('without-status-authority', target, "      return { version: 1, state: 'recorded', receipt };", [
                  'stored status checks entitlement and custody once before returning the exact receipt',
                  'stored status refuses a receipt after entitlement authority is withdrawn',
                  'stored status refuses a receipt after custody authority is withdrawn']),
              ('with-duplicate-authority', target, "      await this.#authorize(c, token, csrf, input.venueId, scope, 'read');\n" + target, [
                  'stored status checks entitlement and custody once before returning the exact receipt']),
          ]
          try:
              for label, old, new, failed in faults:
                  source.write_text(original.replace(old, new, 1))
                  code, output = run(label)
                  reports = re.findall(r'^not ok \d+ - (.+)$', output, re.MULTILINE)
                  assert code != 0 and sorted(reports) == sorted(failed), (label, reports)
          finally:
              source.write_text(original)
          assert run('restored')[0] == 0
          print('Both faults caught by named assertions; restored four real PostgreSQL cases pass.', flush=True)
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fiscal-status-${{ github.event.pull_request.head.sha }}
          path: diagnostics/
          retention-days: 14
