name: D50 remote reply diagnostic
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  packages: read
jobs:
  reproduce:
    if: github.head_ref == 'fix/portal-lost-reply-test'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@waitron-io'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm --filter @waitron-cloud/portal exec playwright install --with-deps chromium
      - run: pnpm --dir apps/portal build
      - name: Observe up to twelve unchanged remote journeys
        shell: bash
        run: |
          mkdir -p /tmp/d50-remote
          for attempt in $(seq 1 12); do
            node scripts/test-postgres.mjs exec pnpm --dir apps/portal exec node --test --test-timeout=120000 test/remote-browser.test.ts 2>&1 | tee "/tmp/d50-remote/attempt-${attempt}.log"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d50-remote-diagnostic
          path: /tmp/d50-remote/
