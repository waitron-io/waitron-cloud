name: Password derivation checks
on:
  pull_request:
    paths:
      - 'packages/registration/test/authenticator-factor.test.ts'
      - '.github/workflows/password-derivation-diagnostic.yml'
permissions:
  contents: read
  packages: read
jobs:
  linux-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@waitron-io'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check password snapshot ordering and deliberate faults
        run: |
          mkdir -p diagnostics
          node scripts/test-postgres.mjs exec python3 -u - <<'PYTHON'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          import json, subprocess, tempfile
          def run(index, checkout=Path.cwd(), pattern="password reset snapshot committed during password derivation"):
              result = subprocess.run(['node', '--test', '--test-timeout=30000',
                  '--test-name-pattern=' + pattern,
                  'packages/registration/test/authenticator-factor.test.ts'],
                  cwd=checkout, capture_output=True, text=True, timeout=45)
              Path(f'diagnostics/case-{index}.log').write_text(result.stdout + result.stderr)
              print(json.dumps({'case': index, 'exit': result.returncode}), flush=True)
              if result.returncode:
                  print(result.stdout + result.stderr, flush=True)
              return result
          with ThreadPoolExecutor(max_workers=4) as workers:
              failures = sum(task.result().returncode != 0 for task in as_completed([workers.submit(run, n) for n in range(4)]))
          print(json.dumps({'cases': 4, 'failures': failures}), flush=True)
          if failures:
              raise SystemExit(1)
          with tempfile.TemporaryDirectory(prefix='password-derivation-') as scratch:
              candidate = Path(scratch) / 'candidate'
              subprocess.run(['git', 'clone', '--quiet', '--no-hardlinks', '.', str(candidate)], check=True)
              subprocess.run(['pnpm', 'install', '--frozen-lockfile', '--offline'], cwd=candidate, check=True)
              factor = candidate / 'packages/registration/test/authenticator-factor.test.ts'
              identity = candidate / 'packages/identity/src/sessions.ts'
              originals = {factor: factor.read_text(), identity: identity.read_text()}
              mutations = [
                  ('without-result-barrier', factor,
                   'void resumeDerivation.then(()=>callback(...result));', 'callback(...result);',
                   'password reset snapshot committed during password derivation'),
                  ('lock-before-derivation', identity,
                   "  const correct = await verifySecret(password, usable ? passwordHash! : DUMMY_PASSWORD_HASH);\n"
                   "  if (!accountId || !usable || !correct) throw new IdentityError('credentials_invalid');\n", '',
                   'password reset snapshot committed during password derivation cannot begin replacement$'),
              ]
              for label, path, old, new, pattern in mutations:
                  try:
                      assert originals[path].count(old) == 1, label + ': mutation target changed'
                      changed = originals[path].replace(old, new, 1)
                      if label == 'lock-before-derivation':
                          target = '  const credentials = await client.query(`SELECT password_hash FROM cloud_credentials'
                          assert changed.count(target) == 1
                          changed = changed.replace(target, old + target, 1)
                      path.write_text(changed)
                      result = run(label, candidate, pattern)
                      output = result.stdout + result.stderr
                      assert result.returncode != 0 and 'must observe the password snapshot' in output, label + ': expected observer refusal missing'
                  finally:
                      path.write_text(originals[path])
              assert run('restored', candidate).returncode == 0
          print('Both deliberate faults were caught; restored real-PostgreSQL cases pass.', flush=True)
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: password-derivation-${{ github.event.pull_request.head.sha }}
          path: diagnostics/
          retention-days: 14
