name: Kubernetes proof prerequisites
on:
  pull_request:
    paths:
      - 'deploy/kubernetes/proof/**'
      - 'scripts/kubernetes-proof-*'
      - '.github/workflows/kubernetes-proof.yml'
  push:
    branches: [main]
    paths:
      - 'deploy/kubernetes/proof/**'
      - 'scripts/kubernetes-proof-*'
      - '.github/workflows/kubernetes-proof.yml'
permissions:
  contents: read
concurrency:
  group: kubernetes-proof-units-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  setup-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Check setup and expiry behavior without AWS access
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/kubernetes-proof-units.tap"
          tests=(deploy/kubernetes/proof/setup.test.mjs deploy/kubernetes/proof/expiry.test.mjs)
          # Run only the prerequisites supplied by the exact checked-out head.
          if [[ -e scripts/kubernetes-proof-budget.mjs || -e scripts/kubernetes-proof-budget.test.mjs || -e deploy/kubernetes/proof/workflow.test.mjs ]]; then
            [[ -f scripts/kubernetes-proof-budget.mjs ]] || exit 1
            tests+=(scripts/kubernetes-proof-budget.test.mjs deploy/kubernetes/proof/workflow.test.mjs)
          fi
          if [[ -e deploy/kubernetes/proof/bootstrap.mjs || -e deploy/kubernetes/proof/bootstrap.sh || -e deploy/kubernetes/proof/bootstrap.test.mjs ]]; then
            [[ -f deploy/kubernetes/proof/bootstrap.mjs && -f deploy/kubernetes/proof/bootstrap.sh ]] || exit 1
            tests+=(deploy/kubernetes/proof/bootstrap.test.mjs)
          fi
          if [[ -e deploy/kubernetes/proof/prices.mjs || -e deploy/kubernetes/proof/prices.test.mjs || -e deploy/kubernetes/proof/test-fixtures/prices.json ]]; then
            [[ -f deploy/kubernetes/proof/prices.mjs && -f deploy/kubernetes/proof/test-fixtures/prices.json ]] || exit 1
            tests+=(deploy/kubernetes/proof/prices.test.mjs)
          fi
          if [[ -e scripts/kubernetes-proof-control.mjs || -e scripts/kubernetes-proof-control.test.mjs ]]; then
            [[ -f scripts/kubernetes-proof-control.mjs ]] || exit 1
            tests+=(scripts/kubernetes-proof-control.test.mjs)
          fi
          for test_file in "${tests[@]}"; do
            [[ -f "$test_file" ]] || { echo "Missing required test: $test_file"; exit 1; }
          done
          node --test --test-reporter=tap --test-timeout=30000 "${tests[@]}" | tee "$report"
          grep -Eq '^# tests [1-9][0-9]*$' "$report"
          grep -Fx '# fail 0' "$report"
          grep -Fx '# cancelled 0' "$report"
          grep -Fx '# skipped 0' "$report"
      - name: Render synthetic template without discovering or changing AWS resources
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module > "$RUNNER_TEMP/d570-rendered.json" <<'JS'
          import { readFileSync } from 'node:fs';
          import { renderSetup } from './deploy/kubernetes/proof/setup.mjs';
          const input = JSON.parse(readFileSync('deploy/kubernetes/proof/test-fixtures/setup-input.json'));
          console.log(JSON.stringify(renderSetup(input), null, 2));
          JS
          node --input-type=module > "$RUNNER_TEMP/d570-manual-rendered.json" <<'JS'
          import { readFileSync } from 'node:fs';
          import { renderManualSetup } from './deploy/kubernetes/proof/setup.mjs';
          const input = JSON.parse(readFileSync('deploy/kubernetes/proof/test-fixtures/setup-input.json'));
          console.log(JSON.stringify(renderManualSetup(input), null, 2));
          JS
      - name: Validate source and rendered CloudFormation without applying either
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/d570-cfn-lint"
          "$RUNNER_TEMP/d570-cfn-lint/bin/pip" install 'cfn-lint==1.59.0'
          "$RUNNER_TEMP/d570-cfn-lint/bin/cfn-lint" deploy/kubernetes/proof/setup.yaml "$RUNNER_TEMP/d570-rendered.json" "$RUNNER_TEMP/d570-manual-rendered.json"
