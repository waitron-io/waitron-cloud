name: Kubernetes proof prerequisites
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: kubernetes-proof-units-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  setup-controls:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Check setup and expiry behavior without AWS access
        shell: bash
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/kubernetes-proof-units.tap"
          node --test --test-reporter=tap --test-timeout=30000 deploy/kubernetes/proof/setup.test.mjs deploy/kubernetes/proof/expiry.test.mjs | tee "$report"
          grep -Eq '^# tests [1-9][0-9]*$' "$report"
          grep -Fx '# fail 0' "$report"
          grep -Fx '# cancelled 0' "$report"
          grep -Fx '# skipped 0' "$report"
      - name: Validate CloudFormation structure without applying it
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/d570-cfn-lint"
          "$RUNNER_TEMP/d570-cfn-lint/bin/pip" install 'cfn-lint==1.59.0'
          "$RUNNER_TEMP/d570-cfn-lint/bin/cfn-lint" deploy/kubernetes/proof/setup.yaml
