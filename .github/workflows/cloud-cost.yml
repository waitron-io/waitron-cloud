name: Cloud cost conformance
on:
  push:
    branches: [main]
    paths: ['**', '!docs/**', '!**/*.md']
  pull_request:
    paths: ['**', '!docs/**', '!**/*.md']
permissions:
  contents: read
  packages: read
concurrency:
  group: cost-conformance-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      files: ${{ steps.files.outputs.files }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          package-manager-cache: false
      - id: files
        run: echo "files=$(node scripts/cloud-cost/conformance.mjs --matrix)" >> "$GITHUB_OUTPUT"
  conformance:
    needs: discover
    name: cost (${{ matrix.file }}, ${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.files) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v6
        env:
          npm_config_fetch_timeout: '15000'
          npm_config_fetch_retries: '1'
          npm_config_fetch_retry_mintimeout: '1000'
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@waitron-io'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Diagnose generated stack startup (temporary)
        if: matrix.file == 'stack-conformance.test.mjs' && matrix.group == '3/3'
        run: |
          python3 - <<'PYDIAG'
          from pathlib import Path
          p=Path('scripts/cloud-cost/local.mjs')
          s=p.read_text().replace("const fail = () => {", "const fail = () => { console.error(new Error('GENERATED_LOCAL_GUARD').stack);")
          s=s.replace("  requireThat(result.status === 0 && !result.error);", "  if(result.status !== 0 || result.error) console.error('GENERATED_DOCKER_FAILURE', JSON.stringify({argv,status:result.status,error:result.error?.message,stderr:result.stderr,stdout:result.stdout}));\n  requireThat(result.status === 0 && !result.error);")
          s=s.replace("} catch { await close?.(); fail(); }", "} catch (error) { console.error('GENERATED_STARTUP_CAUSE', error.stack); await close?.(); fail(); }")
          s=s.replace("} catch { fail(); }", "} catch (error) { console.error('GENERATED_LOCAL_CAUSE', error.stack); fail(); }")
          p.write_text(s)
          p=Path('scripts/cloud-cost/schema.mjs')
          s=p.read_text().replace("const fail = () => {", "const fail = () => { console.error(new Error('GENERATED_SCHEMA_GUARD').stack);")
          s=s.replace("} catch { fail(); }", "} catch (error) { console.error('GENERATED_SCHEMA_CAUSE', error.stack); fail(); }")
          p.write_text(s)
          PYDIAG
          node --input-type=module <<'JSDIAG'
          import {prepareConformance} from './scripts/cloud-cost/conformance-prepare.mjs';
          import {runTests} from './scripts/cloud-cost/conformance.mjs';
          const fixture=await prepareConformance(['stack-conformance.test.mjs']);
          try {
            for(let i=1;i<=24;i++) {
              console.log('GENERATED_STARTUP_REPETITION',i);
              const result=await runTests(['scripts/cloud-cost/fixtures/stack-conformance.test.mjs'],{pattern:'^genuineAmbiguousMultipartRepliesReconcileEveryCommittedStage_false$',env:{...process.env,...fixture.env}});
              if(result.code) { process.exitCode=result.code; break; }
            }
          } finally {fixture.cleanup();}
          JSDIAG
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm test:cloud-cost:conformance --only '${{ matrix.file }}' --pattern '${{ matrix.pattern }}' --skip-pattern '${{ matrix.skipPattern }}'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
