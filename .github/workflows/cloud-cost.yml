name: Cloud cost conformance
on:
  push:
    branches: [main]
    paths: ['**', '!docs/**', '!**/*.md']
  pull_request:
    paths: ['**', '!docs/**', '!**/*.md']
permissions:
  contents: read
  packages: read
concurrency:
  group: cost-conformance-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      files: ${{ steps.files.outputs.files }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          package-manager-cache: false
      - id: files
        run: echo "files=$(node scripts/cloud-cost/conformance.mjs --matrix)" >> "$GITHUB_OUTPUT"
  conformance:
    needs: discover
    name: cost (${{ matrix.file }}, ${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.discover.outputs.files) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: pnpm/action-setup@v6
        env:
          npm_config_fetch_timeout: '15000'
          npm_config_fetch_retries: '1'
          npm_config_fetch_retry_mintimeout: '1000'
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@waitron-io'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Diagnose generated paced replay refusal (temporary)
        if: matrix.file == 'paced-replay-conformance.test.mjs'
        run: |
          python3 - <<'PYDIAG'
          from pathlib import Path
          for p in Path('scripts/cloud-cost').glob('*.mjs'):
            if p.name.endswith('.test.mjs') or p.name in ['conformance.mjs','conformance-prepare.mjs','cli.mjs']:
              continue
            s=p.read_text()
            if p.name=='isolated-replay.mjs':
              s=s.replace("  } catch { fail(); }\n  finally {", "  } catch (error) { console.error('GENERATED_PACED_HOST_CAUSE', error.stack); if(stageRoot && existsSync(join(stageRoot,'generated-only-trace.log'))) console.error('GENERATED_PACED_WORKER_TRACE',readFileSync(join(stageRoot,'generated-only-trace.log'),'utf8')); fail(); }\n  finally {")
            s=s.replace("const fail = () => {", "const fail = () => { generatedTrace(new Error('GENERATED_GUARD').stack);")
            s=s.replace("catch {", "catch (generatedError) { generatedTrace(generatedError?.stack ?? String(generatedError));")
            s="import {appendFileSync as generatedAppend} from 'node:fs';\nfunction generatedTrace(value) { try { generatedAppend('/state/generated-only-trace.log', String(value)+'\\n'); } catch {} }\n"+s
            p.write_text(s)
          PYDIAG
      - run: pnpm test:cloud-cost:conformance --only '${{ matrix.file }}' --pattern '${{ matrix.pattern }}' --skip-pattern '${{ matrix.skipPattern }}'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
