name: Litestream stop diagnostics
on:
  pull_request:
    paths:
      - 'scripts/cloud-cost/litestream*'
      - 'scripts/cloud-cost/fixtures/litestream-smoke.mjs'
      - '.github/workflows/litestream-stop-diagnostic.yml'
permissions:
  contents: read
  packages: read
jobs:
  repeated-stop:
    if: github.head_ref == 'fix/litestream-idle-drain'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        trial: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@waitron-io'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Repeat the unchanged delayed reply case with diagnostics
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p diagnostics
          node --input-type=module <<'JS' 2>&1 | tee diagnostics/repeated-stop.log
          import { prepareConformance } from './scripts/cloud-cost/conformance-prepare.mjs';
          import { runTests } from './scripts/cloud-cost/conformance.mjs';
          const fixture = await prepareConformance(['stack-conformance.test.mjs']);
          let failed = 0;
          try {
            for (let trial = 1; trial <= 10; trial++) {
              const result = await runTests(['scripts/cloud-cost/fixtures/stack-conformance.test.mjs'], {
                pattern: '^genuinePinnedLitestreamDrainsCommittedPutRepliesBeforeShutdown$',
                env: { ...process.env, ...fixture.env }, stdio: ['ignore', 'pipe', 'pipe'],
              });
              console.log(JSON.stringify({ trial, code: result.code }));
              console.log(result.output);
              failed += result.code !== 0;
            }
          } finally { fixture.cleanup(); }
          console.log(JSON.stringify({ trials: 10, failed }));
          process.exitCode = failed ? 1 : 0;
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: litestream-stop-${{ github.event.pull_request.head.sha }}-${{ matrix.trial }}
          path: diagnostics/
          retention-days: 14
