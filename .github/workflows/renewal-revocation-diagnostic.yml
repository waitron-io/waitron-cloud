name: Renewal revocation diagnostics
on:
  pull_request:
    paths:
      - 'packages/registration/test/installations.test.ts'
      - '.github/workflows/renewal-revocation-diagnostic.yml'
permissions:
  contents: read
  packages: read
jobs:
  linux-ordering:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@waitron-io'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Capture independent revocation and renewal interleavings
        run: |
          mkdir -p diagnostics
          node scripts/test-postgres.mjs exec python3 -u - <<'PYTHON'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          import json, subprocess, tempfile
          def run(index):
              result = subprocess.run(['node', '--test', '--test-timeout=30000',
                  '--test-name-pattern=installation lock observation|owner revocation serializes',
                  'packages/registration/test/installations.test.ts'],
                  capture_output=True, text=True, timeout=45)
              Path(f'diagnostics/case-{index}.log').write_text(result.stdout + result.stderr)
              print(json.dumps({'case': index, 'exit': result.returncode}), flush=True)
              if result.returncode:
                  print(result.stdout + result.stderr, flush=True)
              return result.returncode != 0
          with ThreadPoolExecutor(max_workers=4) as workers:
              failures = sum(task.result() for task in as_completed([workers.submit(run, n) for n in range(40)]))
          print(json.dumps({'cases': 40, 'failures': failures}), flush=True)
          if failures:
              raise SystemExit(1)
          with tempfile.TemporaryDirectory(prefix='cloud-renewal-guards-') as scratch:
              candidate = Path(scratch) / 'candidate'
              subprocess.run(['git', 'worktree', 'add', '--detach', str(candidate), 'HEAD'], check=True)
              try:
                  subprocess.run(['pnpm', 'install', '--frozen-lockfile', '--offline'], cwd=candidate, check=True)
                  test_path = candidate / 'packages/registration/test/installations.test.ts'
                  product_path = candidate / 'packages/registration/src/installations.ts'
                  tests = test_path.read_text()
                  product = product_path.read_text()
                  faults = [
                      ('statement', test_path,
                       "AND query LIKE 'SELECT i.*,v.environment,v.organisation_id FROM installations i%FOR UPDATE OF i'", '',
                       'installation lock observation', 'a session wait must not admit the competing renewal'),
                      ('holder', test_path, 'AND $2::integer=ANY(pg_blocking_pids(pid))', 'AND $2::integer IS NOT NULL',
                       'installation lock observation', 'a different connection cannot stand in for the installation holder'),
                      ('revoked', product_path, "return fail('revoked');", ';',
                       'owner revocation serializes', 'Missing expected rejection'),
                  ]
                  for name, path, before, after, pattern, expected in faults:
                      original = path.read_text()
                      assert original.count(before) == 1, name
                      path.write_text(original.replace(before, after))
                      result = subprocess.run(['node', '--test', '--test-timeout=30000',
                          f'--test-name-pattern={pattern}', 'packages/registration/test/installations.test.ts'],
                          cwd=candidate, capture_output=True, text=True, timeout=45)
                      output = result.stdout + result.stderr
                      Path(f'diagnostics/fault-{name}.log').write_text(output)
                      path.write_text(original)
                      assert result.returncode != 0 and expected in output, (name, result.returncode, output)
                      print(json.dumps({'fault': name, 'caught': True}), flush=True)
                  assert test_path.read_text() == tests and product_path.read_text() == product
                  restored = subprocess.run(['node', '--test', '--test-timeout=30000',
                      'packages/registration/test/installations.test.ts'], cwd=candidate,
                      capture_output=True, text=True, timeout=90)
                  Path('diagnostics/restored.log').write_text(restored.stdout + restored.stderr)
                  print(json.dumps({'restored_file_exit': restored.returncode}), flush=True)
                  assert restored.returncode == 0, restored.stdout + restored.stderr
              finally:
                  subprocess.run(['git', 'worktree', 'remove', '--force', str(candidate)], check=True)
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renewal-revocation-${{ github.event.pull_request.head.sha }}
          path: diagnostics/
          retention-days: 14
