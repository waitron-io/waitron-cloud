name: Renewal revocation diagnostics
on:
  pull_request:
    paths:
      - 'packages/registration/test/installations.test.ts'
      - '.github/workflows/renewal-revocation-diagnostic.yml'
permissions:
  contents: read
  packages: read
jobs:
  linux-ordering:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@waitron-io'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Capture independent revocation and renewal interleavings
        run: |
          mkdir -p diagnostics
          node scripts/test-postgres.mjs exec python3 -u - <<'PYTHON'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          import json, subprocess
          def run(index):
              result = subprocess.run(['node', '--test', '--test-timeout=30000',
                  '--test-name-pattern=installation lock observation|owner revocation serializes',
                  'packages/registration/test/installations.test.ts'],
                  capture_output=True, text=True, timeout=45)
              Path(f'diagnostics/case-{index}.log').write_text(result.stdout + result.stderr)
              print(json.dumps({'case': index, 'exit': result.returncode}), flush=True)
              if result.returncode:
                  print(result.stdout + result.stderr, flush=True)
              return result.returncode != 0
          with ThreadPoolExecutor(max_workers=4) as workers:
              failures = sum(task.result() for task in as_completed([workers.submit(run, n) for n in range(4)]))
          print(json.dumps({'cases': 4, 'failures': failures}), flush=True)
          raise SystemExit(bool(failures))
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: renewal-revocation-${{ github.event.pull_request.head.sha }}
          path: diagnostics/
          retention-days: 14
