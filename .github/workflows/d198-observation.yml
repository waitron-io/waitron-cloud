name: D198 Linux observation
on:
  pull_request:
    paths: ['.github/workflows/d198-observation.yml']
permissions:
  contents: read
  packages: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: d198-local-fixture
          POSTGRES_DB: cloud_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 2s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:d198-local-fixture@127.0.0.1:5432/cloud_test
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v6
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci-pnpm-diagnostics.cjs
          npm_config_fetch_timeout: '15000'
          npm_config_fetch_retries: '1'
          npm_config_fetch_retry_mintimeout: '1000'
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@waitron-io'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Observe ordinary completions
        run: |
          for attempt in $(seq 1 8); do
            pnpm --dir packages/account-http exec node --test --test-timeout=30000 --test-name-pattern='owner permission lost after diagnostic reads' test/diagnostics.test.ts
          done
      - name: Controlled delayed submission must expose the old false lock assertion
        env:
          D198_SUBMIT_DELAY_MS: '200'
        run: |
          set +e
          pnpm --dir packages/account-http exec node --test --test-timeout=30000 --test-name-pattern='owner permission lost after diagnostic reads' test/diagnostics.test.ts > /tmp/d198-delayed.log 2>&1
          result=$?
          cat /tmp/d198-delayed.log
          test "$result" -ne 0 && grep -q 'the diagnostic retained the membership lock' /tmp/d198-delayed.log
