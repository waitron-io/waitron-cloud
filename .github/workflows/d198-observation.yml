name: D198 Linux observation
on:
  pull_request:
    paths: ['.github/workflows/d198-observation.yml']
permissions:
  contents: read
  packages: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: d198-local-fixture
          POSTGRES_DB: cloud_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 2s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://postgres:d198-local-fixture@127.0.0.1:5432/cloud_test
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v6
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci-pnpm-diagnostics.cjs
          npm_config_fetch_timeout: '15000'
          npm_config_fetch_retries: '1'
          npm_config_fetch_retry_mintimeout: '1000'
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@waitron-io'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Corrected normal and delayed cases
        run: |
          pnpm --dir packages/account-http exec node --test --test-timeout=30000 test/diagnostics.test.ts
          for attempt in $(seq 1 8); do
            pnpm --dir packages/account-http exec node --test --test-timeout=30000 --test-name-pattern='owner permission lost after diagnostic reads' test/diagnostics.test.ts
          done
      - name: A retained membership lock must still fail within 100 ms
        run: |
          cp packages/account-http/src/diagnostics.ts /tmp/d198-diagnostics-original.ts
          python3 - <<'PYCODE'
          from pathlib import Path
          p=Path('packages/account-http/src/diagnostics.ts');s=p.read_text();assert 'FOR SHARE OF i`' in s;p.write_text(s.replace('FOR SHARE OF i`','FOR SHARE OF i,m`',1))
          PYCODE
          set +e
          pnpm --dir packages/account-http exec node --test --test-timeout=30000 --test-name-pattern='owner permission lost after diagnostic reads' test/diagnostics.test.ts > /tmp/d198-lock-fault.log 2>&1
          result=$?
          set -e
          cp /tmp/d198-diagnostics-original.ts packages/account-http/src/diagnostics.ts
          cat /tmp/d198-lock-fault.log
          test "$result" -ne 0
          grep -q 'lock timeout' /tmp/d198-lock-fault.log
      - name: Missing final ownership recheck must still fail
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          p=Path('packages/account-http/src/diagnostics.ts');s=p.read_text();needle="if(!permission.rowCount)throw new AccountHttpError(403,'forbidden');";assert needle in s;p.write_text(s.replace(needle,'',1))
          PYCODE
          set +e
          pnpm --dir packages/account-http exec node --test --test-timeout=30000 --test-name-pattern='owner permission lost after diagnostic reads' test/diagnostics.test.ts > /tmp/d198-recheck-fault.log 2>&1
          result=$?
          set -e
          cp /tmp/d198-diagnostics-original.ts packages/account-http/src/diagnostics.ts
          cat /tmp/d198-recheck-fault.log
          test "$result" -ne 0
          grep -q '200 !== 403' /tmp/d198-recheck-fault.log
      - name: Restored full diagnostic file
        run: pnpm --dir packages/account-http exec node --test --test-timeout=30000 test/diagnostics.test.ts
