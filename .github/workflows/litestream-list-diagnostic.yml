name: Litestream list interruption observations
on:
  pull_request:
    paths: ['.github/workflows/litestream-list-diagnostic.yml']
permissions:
  contents: read
  packages: read
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        observation: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci-pnpm-diagnostics.cjs
          npm_config_fetch_timeout: '15000'
          npm_config_fetch_retries: '1'
          npm_config_fetch_retry_mintimeout: '1000'
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@waitron-io'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Observe twelve genuine delayed-reply shutdowns
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node scripts/test-postgres.mjs exec node --input-type=module <<'JS'
          import {prepareConformance} from './scripts/cloud-cost/conformance-prepare.mjs';
          import {runTests} from './scripts/cloud-cost/conformance.mjs';
          const fixture=await prepareConformance(['stack-conformance.test.mjs']);
          try {
            for(let observation=1;observation<=12;observation++) {
              console.log(JSON.stringify({observation,head:process.env.GITHUB_SHA}));
              const result=await runTests(['scripts/cloud-cost/fixtures/stack-conformance.test.mjs'],{
                env:{...process.env,...fixture.env},pattern:'^genuinePinnedLitestreamDrainsCommittedPutRepliesBeforeShutdown$'});
              if(result.code) {process.exitCode=result.code;break;}
            }
          } finally {fixture.cleanup();}
          JS
