name: Portal journey diagnostics
on:
  pull_request:
    paths:
      - 'apps/portal/test/journey.test.ts'
      - 'apps/portal/test/translation-consent-browser.test.ts'
      - 'apps/portal/test/portal-trace.ts'
      - '.github/workflows/portal-journey-diagnostic.yml'
permissions:
  contents: read
  packages: read
jobs:
  linux-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@waitron-io'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Chromium with bounded retry
        run: |
          sudo python3 scripts/ci-browser-source.py
          # Root supervision can stop apt children; use the runner's browser cache.
          sudo env "PATH=$PATH" "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" \
            python3 scripts/ci-download.py --timeout 120 --attempts 2 \
            --grace 10 --lock-wait 30 --retry-delay 5 \
            --lock /var/lib/dpkg/lock-frontend --lock /var/lib/dpkg/lock \
            --lock /var/lib/apt/lists/lock --lock /var/cache/apt/archives/lock \
            -- pnpm --filter @waitron-cloud/ui-smoke exec playwright install --with-deps chromium
      - run: pnpm --dir apps/portal build
      - name: Observe repeated real portal journeys
        run: |
          mkdir -p diagnostics
          node scripts/test-postgres.mjs exec python3 -u - <<'PYTHON'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          import subprocess, json
          def run(index):
              result = subprocess.run(['node','--test','--test-reporter=tap','--test-timeout=120000',
                  'test/journey.test.ts','test/translation-consent-browser.test.ts'],
                  cwd='apps/portal',capture_output=True,text=True,timeout=180)
              Path(f'diagnostics/case-{index}.log').write_text(result.stdout+result.stderr)
              print(json.dumps({'case':index,'exit':result.returncode}),flush=True)
              print(result.stdout+result.stderr,flush=True)
              return result.returncode
          with ThreadPoolExecutor(max_workers=2) as workers:
              failures=sum(task.result()!=0 for task in as_completed([workers.submit(run,n) for n in range(4)]))
          raise SystemExit(bool(failures))
          PYTHON
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portal-diagnostics-${{ github.event.pull_request.head.sha }}
          path: diagnostics/
          retention-days: 14
