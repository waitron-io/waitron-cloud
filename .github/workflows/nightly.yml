name: Nightly full CI
on:
  schedule:
    # Off the hour, after the usual European working day. GitHub uses UTC.
    - cron: '17 3 * * *'
  workflow_dispatch:
  # Rehearse this parent when its own file changes.
  pull_request:
    paths:
      - '.github/workflows/nightly.yml'
permissions:
  contents: read
  packages: read
  actions: read
  pull-requests: read
concurrency:
  # Keep every scheduled/manual run; a PR update may cancel its older rehearsal.
  group: nightly-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  standard:
    uses: ./.github/workflows/ci.yml
    with:
      full: true
      job-prefix: 'standard / '
  cost:
    uses: ./.github/workflows/cloud-cost.yml
    with:
      full: true
      job-prefix: 'cost / '
  venue:
    uses: ./.github/workflows/venue-services-proof.yml
    with:
      full: true
      job-prefix: 'venue / '
  aws:
    uses: ./.github/workflows/aws-infrastructure.yml
    with:
      full: true
      job-prefix: 'aws / '
  mutations:
    name: nightly-mutations
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          package-manager-cache: false
      - run: node scripts/ci-setup-pnpm.mjs
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci-pnpm-diagnostics.cjs
          npm_config_fetch_timeout: '15000'
          npm_config_fetch_retries: '1'
          npm_config_fetch_retry_mintimeout: '1000'
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          package-manager-cache: false
          registry-url: https://npm.pkg.github.com
          scope: '@waitron-io'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # The allowance wrapper also runs its complete pure and synthetic harness.
      - run: node scripts/test-postgres.mjs exec node --test --test-reporter=tap --test-concurrency=1 packages/account-http/test/venue-service-direct-wait-guards.nightly.ts packages/account-http/test/venue-service-external-wait-guards.nightly.ts packages/registration/test/billing-allowance-guards.nightly.ts packages/registration/test/billing-guard-qualification.nightly.ts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Exercise stale ownership under bounded CPU contention
        run: |
          set -o pipefail
          mkdir -p diagnostics
          python3 -u - <<'PY' | tee diagnostics/native-linux.log
          from concurrent.futures import ThreadPoolExecutor, as_completed
          import json, os, subprocess, sys, time
          # Restrict only this job's children, making launch contention repeatable.
          os.sched_setaffinity(0, {min(os.sched_getaffinity(0))})
          print(json.dumps({'affinity_cpus': sorted(os.sched_getaffinity(0))}))
          def run(index):
              start = time.monotonic()
              try:
                  result = subprocess.run([
                      sys.executable, 'scripts/fixtures/ci-download-linux.py',
                      'scripts/ci-download.py', 'stale',
                  ], env={**os.environ, 'CI_DOWNLOAD_REPORT_PROGRESS': '1'},
                      capture_output=True, text=True, timeout=15)
              except subprocess.TimeoutExpired as error:
                  def text(value):
                      return value.decode('utf-8', errors='replace') if isinstance(value, bytes) else value or ''
                  result = subprocess.CompletedProcess(error.cmd, 124,
                      stdout=text(error.stdout), stderr=text(error.stderr) + '\nCase exceeded 15 seconds\n')
              return index, time.monotonic() - start, result
          failures = 0
          with ThreadPoolExecutor(max_workers=8) as workers:
              for task in as_completed([workers.submit(run, n) for n in range(32)]):
                  index, elapsed, result = task.result()
                  print(json.dumps({'case': index, 'seconds': elapsed, 'exit': result.returncode}))
                  print(result.stdout, end='')
                  print(result.stderr, end='')
                  failures += result.returncode != 0
          print(json.dumps({'cases': 32, 'failures': failures}))
          raise SystemExit(bool(failures))
          PY
      - name: Check password snapshot ordering and deliberate faults
        run: |
          mkdir -p diagnostics
          node scripts/test-postgres.mjs exec python3 -u - <<'PYTHON'
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path
          import json, subprocess, tempfile, re
          def run(index, checkout=Path.cwd(), pattern="password reset snapshot committed during password derivation"):
              result = subprocess.run(['node', '--test', '--test-reporter=tap', '--test-timeout=30000',
                  '--test-name-pattern=' + pattern,
                  'packages/registration/test/authenticator-factor.test.ts'],
                  cwd=checkout, capture_output=True, text=True, timeout=45)
              Path(f'diagnostics/case-{index}.log').write_text(result.stdout + result.stderr)
              print(json.dumps({'case': index, 'exit': result.returncode}), flush=True)
              if result.returncode:
                  print(result.stdout + result.stderr, flush=True)
              return result
          with ThreadPoolExecutor(max_workers=4) as workers:
              failures = sum(task.result().returncode != 0 for task in as_completed([workers.submit(run, n) for n in range(4)]))
          print(json.dumps({'cases': 4, 'failures': failures}), flush=True)
          if failures:
              raise SystemExit(1)
          with tempfile.TemporaryDirectory(prefix='password-derivation-') as scratch:
              candidate = Path(scratch) / 'candidate'
              subprocess.run(['git', 'clone', '--quiet', '--no-hardlinks', '.', str(candidate)], check=True)
              subprocess.run(['pnpm', 'install', '--frozen-lockfile', '--offline'], cwd=candidate, check=True)
              factor = candidate / 'packages/registration/test/authenticator-factor.test.ts'
              identity = candidate / 'packages/identity/src/sessions.ts'
              originals = {factor: factor.read_text(), identity: identity.read_text()}
              mutations = [
                  ('without-result-barrier', factor,
                   'void resumeDerivation.then(()=>callback(...result));', 'callback(...result);',
                   'password reset snapshot committed during password derivation'),
                  ('lock-before-derivation', identity,
                   "  const correct = await verifySecret(password, usable ? passwordHash! : DUMMY_PASSWORD_HASH);\n"
                   "  if (!accountId || !usable || !correct) throw new IdentityError('credentials_invalid');\n", '',
                   'password reset snapshot committed during password derivation'),
              ]
              for label, path, old, new, pattern in mutations:
                  try:
                      assert originals[path].count(old) == 1, label + ': mutation target changed'
                      changed = originals[path].replace(old, new, 1)
                      if label == 'lock-before-derivation':
                          target = '  const credentials = await client.query(`SELECT password_hash FROM cloud_credentials'
                          assert changed.count(target) == 1
                          changed = changed.replace(target, old + target, 1)
                      path.write_text(changed)
                      result = run(label, candidate, pattern)
                      output = result.stdout + result.stderr
                      assert result.returncode != 0 and 'must observe the password snapshot' in output, label + ': expected observer refusal missing'
                      name = 'a password reset snapshot committed during password derivation cannot begin replacement'
                      reports = dict((name, status) for status, name in re.findall(r'^(not ok|ok) \d+ - (.+)$', output, re.MULTILINE))
                      expected = {name: 'ok' if label == 'without-result-barrier' else 'not ok',
                                  name + ' with delayed observation': 'not ok'}
                      assert reports == expected, label + ': wrong test variant failed: ' + repr(reports)
                  finally:
                      path.write_text(originals[path])
              assert run('restored', candidate).returncode == 0
          print('Both deliberate faults were caught; restored real-PostgreSQL cases pass.', flush=True)
          PYTHON
      - name: Prove counter rollback, retry and deleted-guard refusal
        run: |
          mkdir -p diagnostics
          node scripts/test-postgres.mjs exec python3 -u - <<'PYTHON'
          from pathlib import Path
          import json, subprocess, tempfile
          def run(label, checkout):
              result = subprocess.run(['node', '--test', '--test-reporter=tap', '--test-timeout=30000',
                  '--test-name-pattern=migration setup survives a proved counter rollover',
                  'packages/registration/test/relay-control-migration.test.ts'],
                  cwd=checkout, capture_output=True, text=True, timeout=45)
              Path('diagnostics', label + '.log').write_text(result.stdout + result.stderr)
              print(json.dumps({'case': label, 'exit': result.returncode}), flush=True)
              return result
          baseline = run('baseline', Path.cwd())
          if baseline.returncode:
              print(baseline.stdout + baseline.stderr, flush=True)
              raise SystemExit(1)
          with tempfile.TemporaryDirectory(prefix='relay-counter-') as scratch:
              candidate = Path(scratch) / 'candidate'
              subprocess.run(['git', 'clone', '--quiet', '--no-hardlinks', '.', str(candidate)], check=True)
              subprocess.run(['pnpm', 'install', '--frozen-lockfile', '--offline'], cwd=candidate, check=True)
              path = candidate / 'packages/registration/src/relay-messages.ts'
              original = path.read_text()
              guard = "if(counterEnd.getTime()<=now)throw new RelayBoundsError('relay_unavailable',{cause:{kind:'relay_counter_expired',counterEndsAt:counterEnd.getTime(),observedAt:now}});"
              assert original.count(guard) == 1, 'counter guard changed; review the experiment'
              test_path = candidate / 'packages/registration/test/relay-control-migration.test.ts'
              originals = {path: original, test_path: test_path.read_text()}
              replay = "}else if(!reservation.replay)messageError('relay_unavailable');"
              faults = [
                  ('without-counter-guard', path, guard, '', 'the deliberately expired admission is reported'),
                  ('without-clock-evidence', path, guard, "if(counterEnd.getTime()<=now)throw new RelayBoundsError('relay_unavailable');", 'relay_unavailable'),
                  ('without-pool-observer', test_path, "f.pool.on('connect', observeClient);", '', 'the pool connection used for admission reports the rollover notice'),
                  ('replay-counter-increment', path, replay, replay + "if(!created)await client.query('UPDATE relay_bounds_counters SET count=count+1');", 'replay preserves both abuse counters'),
              ]
              for label, target, old, replacement, expected in faults:
                  try:
                      assert originals[target].count(old) == 1, label + ': mutation target changed'
                      target.write_text(originals[target].replace(old, replacement))
                      result = run(label, candidate)
                      output = result.stdout + result.stderr
                      assert result.returncode != 0 and expected in output, label + ': expected failure missing'
                      if label == 'without-clock-evidence':
                          assert 'admitFixtureMessage' in output and "code: 'relay_unavailable'" in output, 'wrong refusal path'
                  finally:
                      target.write_text(originals[target])
              restored = run('restored', candidate)
              if restored.returncode:
                  print(restored.stdout + restored.stderr, flush=True)
                  raise SystemExit(1)
          print('All four guard, evidence, notice and replay faults caught; restored real-PostgreSQL check passes.', flush=True)
          PYTHON
      - name: Retain diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: diagnostics/
          retention-days: 14
  storage-advisory:
    needs: cost
    if: ${{ always() }}
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Report generated storage changes
        run: |
          if test -f scripts/ci-nightly-storage.mjs; then
            node scripts/ci-nightly-storage.mjs
          else
            echo '::warning::Cloud cost advisory unavailable for this head.'
            printf '# Cloud cost advisory\n\nStorage advisory unavailable for this head.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  summary:
    name: nightly-summary
    if: ${{ always() }}
    needs: [standard, cost, venue, aws, mutations]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Require every full workflow and publish its result
        run: node scripts/ci-nightly-summary.mjs
        env:
          CI_NIGHTLY_RESULTS: ${{ toJSON(needs) }}
