name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  packages: read
  actions: read
  pull-requests: read
concurrency:
  # Every main merge needs its own run, even when several merges arrive together.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      typecheck: ${{ steps.plan.outputs.typecheck }}
      packages: ${{ steps.plan.outputs.packages }}
      receipts: ${{ steps.plan.outputs.receipts }}
      documentation: ${{ steps.plan.outputs.documentation }}
      scripts: ${{ steps.plan.outputs.scripts }}
      package_matrix: ${{ steps.plan.outputs.package_matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          package-manager-cache: false
      - run: node scripts/ci-setup-pnpm.mjs
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci-pnpm-diagnostics.cjs
          npm_config_fetch_timeout: '15000'
          npm_config_fetch_retries: '1'
          npm_config_fetch_retry_mintimeout: '1000'
      # Pull requests select affected work; every main push runs the full suite.
      - id: plan
        run: node scripts/ci-plan.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  documentation:
    needs: changes
    if: needs.changes.outputs.documentation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          package-manager-cache: false
      - run: node scripts/ci-docs.mjs
        env:
          CI_PLAN: ${{ needs.changes.outputs.plan }}
  scripts:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          package-manager-cache: false
      - run: node scripts/ci-scripts.mjs
        env:
          CI_PLAN: ${{ needs.changes.outputs.plan }}
  root:
    needs: changes
    if: needs.changes.outputs.typecheck == 'true'
    name: root (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          package-manager-cache: false
      - run: node scripts/ci-setup-pnpm.mjs
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci-pnpm-diagnostics.cjs
          npm_config_fetch_timeout: '15000'
          npm_config_fetch_retries: '1'
          npm_config_fetch_retry_mintimeout: '1000'
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@waitron-io'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node --test --test-reporter=tap --test-concurrency=2 --test-shard=${{ matrix.shard }}/4 scripts/ci-*.test.mjs scripts/identity-upstream.test.mjs scripts/verify-gateway-reconnection-receipt.test.mjs
  typecheck:
    needs: changes
    if: needs.changes.outputs.typecheck == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          package-manager-cache: false
      - run: node scripts/ci-setup-pnpm.mjs
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci-pnpm-diagnostics.cjs
          npm_config_fetch_timeout: '15000'
          npm_config_fetch_retries: '1'
          npm_config_fetch_retry_mintimeout: '1000'
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@waitron-io'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm typecheck
  receipts:
    needs: changes
    if: needs.changes.outputs.receipts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          package-manager-cache: false
      - run: node scripts/ci-setup-pnpm.mjs
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci-pnpm-diagnostics.cjs
          npm_config_fetch_timeout: '15000'
          npm_config_fetch_retries: '1'
          npm_config_fetch_retry_mintimeout: '1000'
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@waitron-io'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node scripts/ci-run-receipts.mjs
        env:
          CI_PLAN: ${{ needs.changes.outputs.plan }}
  packages:
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    name: package (${{ matrix.package }}${{ matrix.shards && format(', shard {0}/{1}', matrix.shard, matrix.shards) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.package_matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Upgrade tests run against pinned historical releases.
          fetch-depth: ${{ (matrix.package == '@waitron-cloud/registration' || matrix.package == '@waitron-cloud/fiscal-allocation' || matrix.package == '@waitron-cloud/translation') && '0' || '1' }}
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          package-manager-cache: false
      - run: node scripts/ci-setup-pnpm.mjs
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci-pnpm-diagnostics.cjs
          npm_config_fetch_timeout: '15000'
          npm_config_fetch_retries: '1'
          npm_config_fetch_retry_mintimeout: '1000'
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@waitron-io'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Chromium with bounded retry
        if: matrix.package == '@waitron-cloud/portal' || matrix.package == '@waitron-cloud/ui-smoke'
        run: |
          sudo python3 scripts/ci-browser-source.py
          # Root supervision can stop apt children; use the runner's browser cache.
          sudo env "PATH=$PATH" "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" \
            python3 scripts/ci-download.py --timeout 120 --attempts 2 \
            --grace 10 --lock-wait 30 --retry-delay 5 \
            --lock /var/lib/dpkg/lock-frontend --lock /var/lib/dpkg/lock \
            --lock /var/lib/apt/lists/lock --lock /var/cache/apt/archives/lock \
            -- pnpm --filter @waitron-cloud/ui-smoke exec playwright install --with-deps chromium
      - if: ${{ !matrix.shards && !matrix.members }}
        run: node scripts/test-postgres.mjs --filter ${{ matrix.package }} test
      - if: matrix.members
        run: node scripts/test-postgres.mjs exec node scripts/ci-run-package-group.mjs
        env:
          CI_PACKAGE_GROUP: ${{ toJSON(matrix) }}
      - if: matrix.package == '@waitron-cloud/portal'
        run: pnpm --filter ${{ matrix.package }} build
      - if: matrix.shards
        run: node scripts/test-postgres.mjs exec pnpm --filter ${{ matrix.package }} exec node --test --test-timeout=${{ matrix.package == '@waitron-cloud/portal' && '120000' || '30000' }} --test-shard=${{ matrix.shard }}/${{ matrix.shards }} "test/*.test.ts"
  summary:
    if: ${{ always() }}
    needs: [changes, root, typecheck, receipts, packages, documentation, scripts]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Require precisely the planned jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_PLAN: ${{ needs.changes.outputs.plan }}
          CI_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/ci-summary.mjs
