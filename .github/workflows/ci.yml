name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  packages: read
concurrency:
  # Every main merge needs its own run, even when several merges arrive together.
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@waitron-io'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node --test scripts/ci-workflow.test.mjs scripts/identity-upstream.test.mjs scripts/verify-gateway-reconnection-receipt.test.mjs
      - run: pnpm typecheck
  receipts:
    name: receipt (${{ matrix.suite }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        suite:
          - test:two-venue-milestone-receipt
          - test:backup-capacity
          - test:public-gateway-limits
          - test:local-stack
          - test:database-recovery-receipt
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@waitron-io'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm ${{ matrix.suite }}
  packages:
    name: package (${{ matrix.package }}${{ matrix.shards && format(', shard {0}/{1}', matrix.shard, matrix.shards) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        shard: [1]
        package:
          - '@waitron-cloud/registration'
          - '@waitron-cloud/fiscal-allocation'
          - '@waitron-cloud/backups'
          - '@waitron-cloud/account-http'
          - '@waitron-cloud/identity'
          - '@waitron-cloud/operations'
          - '@waitron-cloud/remote-access'
          - '@waitron-cloud/portal'
          - '@waitron-cloud/ui-smoke'
        # Node partitions the sorted file list; each file runs in exactly one shard.
        include:
          - package: '@waitron-cloud/registration'
            shard: 1
            shards: 6
          - package: '@waitron-cloud/registration'
            shard: 2
            shards: 6
          - package: '@waitron-cloud/registration'
            shard: 3
            shards: 6
          - package: '@waitron-cloud/registration'
            shard: 4
            shards: 6
          - package: '@waitron-cloud/registration'
            shard: 5
            shards: 6
          - package: '@waitron-cloud/registration'
            shard: 6
            shards: 6
          - package: '@waitron-cloud/account-http'
            shard: 1
            shards: 3
          - package: '@waitron-cloud/account-http'
            shard: 2
            shards: 3
          - package: '@waitron-cloud/account-http'
            shard: 3
            shards: 3
          - package: '@waitron-cloud/backups'
            shard: 1
            shards: 2
          - package: '@waitron-cloud/backups'
            shard: 2
            shards: 2
          - package: '@waitron-cloud/portal'
            shard: 1
            shards: 3
          - package: '@waitron-cloud/portal'
            shard: 2
            shards: 3
          - package: '@waitron-cloud/portal'
            shard: 3
            shards: 3
    steps:
      - uses: actions/checkout@v5
        with:
          # Registration runs populated upgrades with pinned historical runners.
          fetch-depth: ${{ (matrix.package == '@waitron-cloud/registration' || matrix.package == '@waitron-cloud/fiscal-allocation') && '0' || '1' }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@waitron-io'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Chromium with bounded retry
        if: matrix.package == '@waitron-cloud/portal' || matrix.package == '@waitron-cloud/ui-smoke'
        run: |
          for attempt in 1 2; do
            if timeout --kill-after=10s 120s pnpm --filter @waitron-cloud/ui-smoke exec playwright install --with-deps chromium; then
              break
            fi
            if [ "$attempt" -eq 2 ]; then exit 1; fi
            sleep 5
          done
      - if: ${{ !matrix.shards }}
        run: node scripts/test-postgres.mjs --filter ${{ matrix.package }} test
      - if: matrix.package == '@waitron-cloud/portal'
        run: pnpm --filter ${{ matrix.package }} build
      - if: matrix.shards
        run: node scripts/test-postgres.mjs exec pnpm --filter ${{ matrix.package }} exec node --test --test-timeout=${{ matrix.package == '@waitron-cloud/portal' && '120000' || '30000' }} --test-shard=${{ matrix.shard }}/${{ matrix.shards }} "test/*.test.ts"
  summary:
    if: ${{ always() }}
    needs: [typecheck, receipts, packages]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every job to succeed
        env:
          TYPECHECK: ${{ needs.typecheck.result }}
          RECEIPTS: ${{ needs.receipts.result }}
          PACKAGES: ${{ needs.packages.result }}
        run: |
          for result in "$TYPECHECK" "$RECEIPTS" "$PACKAGES"; do
            [ "$result" = success ] || exit 1
          done
