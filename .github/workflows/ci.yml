name: CI
on:
  workflow_call:
    inputs:
      full:
        type: boolean
        default: true
      job-prefix:
        type: string
        default: ''
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  packages: read
  actions: read
  pull-requests: read
concurrency:
  # Every main merge needs its own run, even when several merges arrive together.
  group: ci-${{ inputs.full && 'nightly-' || '' }}${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ !inputs.full && github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      decision_artifact: ${{ steps.plan.outputs.decision_artifact }}
      mode: ${{ steps.plan.outputs.mode }}
      typecheck: ${{ steps.plan.outputs.typecheck }}
      root_tests: ${{ steps.plan.outputs.root_tests }}
      packages: ${{ steps.plan.outputs.packages }}
      receipts: ${{ steps.plan.outputs.receipts }}
      documentation: ${{ steps.plan.outputs.documentation }}
      scripts: ${{ steps.plan.outputs.scripts }}
      package_matrix: ${{ steps.plan.outputs.package_matrix }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          package-manager-cache: false
      - run: node scripts/ci-setup-pnpm.mjs
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci-pnpm-diagnostics.cjs
          npm_config_fetch_timeout: '15000'
          npm_config_fetch_retries: '1'
          npm_config_fetch_retry_mintimeout: '1000'
      - name: Check shared UI version lag
        run: |
          if [ -f scripts/ci-ui-lag.mjs ]; then
            node scripts/ci-ui-lag.mjs
          else
            echo 'Skipping shared UI version lag: scripts/ci-ui-lag.mjs is not on this head.'
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # A main push reuses only independently verified identical-tree evidence.
      - id: plan
        run: node scripts/ci-plan.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_FORCE_FULL: ${{ inputs.full }}
          CI_WORKFLOW_INPUTS: ${{ toJSON(inputs) }}
          CI_RECORD_EVIDENCE: 'true'
      - name: Retain source plan
        if: steps.plan.outputs.source_artifact != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.plan.outputs.source_artifact }}
          path: .ci-evidence/source/plan.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Retain main decision
        if: steps.plan.outputs.decision_artifact != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.plan.outputs.decision_artifact }}
          path: .ci-evidence/decision/plan.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  documentation:
    needs: changes
    if: needs.changes.outputs.documentation == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          package-manager-cache: false
      - run: node scripts/ci-docs.mjs
        env:
          CI_PLAN: ${{ needs.changes.outputs.plan }}
  scripts:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          package-manager-cache: false
      - run: node scripts/ci-scripts.mjs
        env:
          CI_PLAN: ${{ needs.changes.outputs.plan }}
  root:
    needs: changes
    if: needs.changes.outputs.root_tests == 'true'
    name: root (${{ matrix.shard }}/8)
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Expose main to nested test fixtures
        run: git branch --force main refs/remotes/origin/main
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          package-manager-cache: false
      - run: node scripts/ci-setup-pnpm.mjs
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci-pnpm-diagnostics.cjs
          npm_config_fetch_timeout: '15000'
          npm_config_fetch_retries: '1'
          npm_config_fetch_retry_mintimeout: '1000'
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          package-manager-cache: false
          registry-url: https://npm.pkg.github.com
          scope: '@waitron-io'
      - name: Locate pnpm dependency store
        id: pnpm-store
        # The cache version must not depend on the bootstrap's random binary path.
        run: |
          export npm_config_store_dir="$RUNNER_TEMP/cloud-pnpm-store"
          echo "npm_config_store_dir=$npm_config_store_dir" >> "$GITHUB_ENV"
          pnpm_store_path=$(pnpm store path --silent) || exit "$?"
          test -n "$pnpm_store_path" || exit 1
          echo "path=$pnpm_store_path" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm dependency cache
        id: pnpm-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-node26-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify exact root input work
        run: node scripts/ci-root-inputs.mjs --check
        env:
          CI_PLAN: ${{ needs.changes.outputs.plan }}
      - run: node --test --test-reporter=tap --test-concurrency=2 --test-shard=${{ matrix.shard }}/8 scripts/ci-*.test.mjs scripts/identity-upstream.test.mjs scripts/verify-gateway-reconnection-receipt.test.mjs scripts/billing-display-guard-probes.test.mjs scripts/venue-service-guard-probes.test.mjs
      # Keep optional saving last so final runner cleanup collects its child processes.
      - name: Save pnpm dependency cache
        if: success() && steps.pnpm-cache.outputs.cache-hit != 'true'
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
  typecheck:
    needs: changes
    if: needs.changes.outputs.typecheck == 'true'
    runs-on: ${{ !inputs.full && github.event_name == 'pull_request' && github.event.pull_request.head.repo.id == github.event.repository.id && github.run_attempt == 1 && vars.DISPOSABLE_TESTS_MODE == 'server' && vars.DISPOSABLE_TESTS_HEAD == github.event.pull_request.head.sha && fromJSON(format('["self-hosted","dt-{0}-{1}-{2}-typecheck"]', github.repository_id, github.run_id, github.run_attempt)) || 'ubuntu-latest' }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          package-manager-cache: false
      - run: node scripts/ci-setup-pnpm.mjs
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci-pnpm-diagnostics.cjs
          npm_config_fetch_timeout: '15000'
          npm_config_fetch_retries: '1'
          npm_config_fetch_retry_mintimeout: '1000'
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          package-manager-cache: false
          registry-url: https://npm.pkg.github.com
          scope: '@waitron-io'
      - name: Locate pnpm dependency store
        id: pnpm-store
        # The cache version must not depend on the bootstrap's random binary path.
        run: |
          export npm_config_store_dir="$RUNNER_TEMP/cloud-pnpm-store"
          echo "npm_config_store_dir=$npm_config_store_dir" >> "$GITHUB_ENV"
          pnpm_store_path=$(pnpm store path --silent) || exit "$?"
          test -n "$pnpm_store_path" || exit 1
          echo "path=$pnpm_store_path" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm dependency cache
        id: pnpm-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-node26-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm typecheck
      # Keep optional saving last so final runner cleanup collects its child processes.
      - name: Save pnpm dependency cache
        if: success() && steps.pnpm-cache.outputs.cache-hit != 'true'
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
  receipts:
    needs: changes
    if: needs.changes.outputs.receipts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          package-manager-cache: false
      - run: node scripts/ci-setup-pnpm.mjs
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci-pnpm-diagnostics.cjs
          npm_config_fetch_timeout: '15000'
          npm_config_fetch_retries: '1'
          npm_config_fetch_retry_mintimeout: '1000'
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          package-manager-cache: false
          registry-url: https://npm.pkg.github.com
          scope: '@waitron-io'
      - name: Locate pnpm dependency store
        id: pnpm-store
        # The cache version must not depend on the bootstrap's random binary path.
        run: |
          export npm_config_store_dir="$RUNNER_TEMP/cloud-pnpm-store"
          echo "npm_config_store_dir=$npm_config_store_dir" >> "$GITHUB_ENV"
          pnpm_store_path=$(pnpm store path --silent) || exit "$?"
          test -n "$pnpm_store_path" || exit 1
          echo "path=$pnpm_store_path" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm dependency cache
        id: pnpm-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-node26-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Verify exact root input work
        run: node scripts/ci-root-inputs.mjs --check
        env:
          CI_PLAN: ${{ needs.changes.outputs.plan }}
      - run: node scripts/ci-run-receipts.mjs
        env:
          CI_PLAN: ${{ needs.changes.outputs.plan }}
          CI_RECEIPT_CONCURRENCY: '2'
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Keep optional saving last so final runner cleanup collects its child processes.
      - name: Save pnpm dependency cache
        if: success() && steps.pnpm-cache.outputs.cache-hit != 'true'
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
  packages:
    needs: changes
    if: needs.changes.outputs.packages == 'true'
    name: package (${{ matrix.package }}${{ matrix.shards && format(', shard {0}/{1}', matrix.shard, matrix.shards) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.package_matrix) }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Upgrade tests run against pinned historical releases.
          fetch-depth: ${{ (matrix.package == '@waitron-cloud/registration' || matrix.package == '@waitron-cloud/translation') && '0' || '1' }}
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          package-manager-cache: false
      - run: node scripts/ci-setup-pnpm.mjs
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci-pnpm-diagnostics.cjs
          npm_config_fetch_timeout: '15000'
          npm_config_fetch_retries: '1'
          npm_config_fetch_retry_mintimeout: '1000'
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          package-manager-cache: false
          registry-url: https://npm.pkg.github.com
          scope: '@waitron-io'
      - name: Locate pnpm dependency store
        id: pnpm-store
        # The cache version must not depend on the bootstrap's random binary path.
        run: |
          export npm_config_store_dir="$RUNNER_TEMP/cloud-pnpm-store"
          echo "npm_config_store_dir=$npm_config_store_dir" >> "$GITHUB_ENV"
          pnpm_store_path=$(pnpm store path --silent) || exit "$?"
          test -n "$pnpm_store_path" || exit 1
          echo "path=$pnpm_store_path" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm dependency cache
        id: pnpm-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-node26-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Install Chromium with bounded retry
        if: matrix.package == '@waitron-cloud/portal' || matrix.package == '@waitron-cloud/ui-smoke'
        run: |
          sudo python3 scripts/ci-browser-source.py
          # Root supervision can stop apt children; use the runner's browser cache.
          sudo env "PATH=$PATH" "PLAYWRIGHT_BROWSERS_PATH=$HOME/.cache/ms-playwright" \
            python3 scripts/ci-download.py --timeout 120 --attempts 2 \
            --grace 10 --lock-wait 30 --retry-delay 5 \
            --lock /var/lib/dpkg/lock-frontend --lock /var/lib/dpkg/lock \
            --lock /var/lib/apt/lists/lock --lock /var/cache/apt/archives/lock \
            -- pnpm --filter @waitron-cloud/ui-smoke exec playwright install --with-deps chromium
      - if: ${{ !matrix.shards && !matrix.members }}
        run: node scripts/test-postgres.mjs --filter ${{ matrix.package }} test
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: matrix.members
        run: node scripts/test-postgres.mjs exec node scripts/ci-run-package-group.mjs
        env:
          CI_PACKAGE_GROUP: ${{ toJSON(matrix) }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: matrix.package == '@waitron-cloud/portal'
        run: pnpm --filter ${{ matrix.package }} build
      - if: matrix.package == '@waitron-cloud/registration'
        run: node scripts/test-postgres.mjs exec pnpm --filter ${{ matrix.package }} exec node ../../scripts/ci-run-registration-shard.mjs ${{ matrix.shard }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: matrix.package == '@waitron-cloud/remote-access'
        run: node scripts/test-postgres.mjs exec pnpm --filter ${{ matrix.package }} exec node ../../scripts/ci-run-remote-shard.mjs ${{ matrix.shard }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - if: matrix.shards && matrix.package != '@waitron-cloud/registration' && matrix.package != '@waitron-cloud/remote-access'
        run: node scripts/test-postgres.mjs exec pnpm --filter ${{ matrix.package }} exec node --test --test-reporter=tap --test-reporter-destination=stdout --test-reporter=../../scripts/ci-required-cases.mjs --test-reporter-destination=stdout --test-timeout=${{ matrix.package == '@waitron-cloud/portal' && '120000' || '30000' }} --test-shard=${{ matrix.shard }}/${{ matrix.shards }} "test/*.test.ts"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # Keep optional saving last so final runner cleanup collects its child processes.
      - name: Save pnpm dependency cache
        if: success() && steps.pnpm-cache.outputs.cache-hit != 'true'
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
  summary:
    if: ${{ always() }}
    needs: [changes, root, typecheck, receipts, packages, documentation, scripts]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          package-manager-cache: false
      - id: complete-decision
        name: Require precisely the planned jobs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_PLAN: ${{ needs.changes.outputs.plan }}
          CI_RECORD_DECISION: 'true'
          CI_MODE: ${{ needs.changes.outputs.mode }}
          CI_DECISION_ARTIFACT: ${{ needs.changes.outputs.decision_artifact }}
          CI_JOB_PREFIX: ${{ inputs.job-prefix }}
          CI_WORKFLOW_INPUTS: ${{ toJSON(inputs) }}
          CI_RESULTS: ${{ toJSON(needs) }}
        run: node scripts/ci-summary.mjs
      - name: Retain completed full decision
        if: steps.complete-decision.outputs.decision_artifact != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.complete-decision.outputs.decision_artifact }}
          path: .ci-evidence/decision/plan.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
