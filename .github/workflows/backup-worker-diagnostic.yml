name: Backup worker diagnostic
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  packages: read
jobs:
  reproduce:
    if: github.head_ref == 'fix/backup-worker-container-race'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          registry-url: https://npm.pkg.github.com
          scope: '@waitron-io'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: docker build -q -t cloud-verifier-probe -f packages/backups/test/container-fixture/Dockerfile .
      - name: Record container environment
        run: |
          docker version
          uname -a
          docker info --format '{{.CgroupVersion}} {{.CgroupDriver}}'
      - name: Capture package lifecycle events without wrapping Docker commands
        run: |
          cat > /tmp/d48-event-only-probe.mjs <<'NODE'
          import {spawn,execFileSync} from 'node:child_process';
          import {mkdir,writeFile,appendFile} from 'node:fs/promises';
          import {join,resolve} from 'node:path';
          import {createInterface} from 'node:readline';
          const directory=resolve(process.env.PROBE_OUTPUT??'/tmp/d48-boundary');
          await mkdir(directory,{recursive:true});
          const realDocker=execFileSync('which',['docker'],{encoding:'utf8'}).trim();
          const eventsPath=join(directory,'events.jsonl');
          let eventWrites=Promise.resolve(),eventCount=0,eventError;
          const events=spawn(realDocker,['events','--since',new Date().toISOString(),'--filter','label=cloud.backup-verifier.owner','--format','{{json .}}'],{stdio:['ignore','pipe','pipe']});
          const eventClosed=new Promise(resolve=>events.once('close',(code,signal)=>resolve({code,signal})));
          events.once('error',error=>{eventError=error.code;});
          events.stderr.on('data',()=>{eventError='event-stream-stderr';});
          createInterface({input:events.stdout}).on('line',line=>{
           try{const value=JSON.parse(line),a=value.Actor?.Attributes??{};
            const fixed={timeNano:value.timeNano,action:value.Action?.split(':')[0],id:value.Actor?.ID,owner:a['cloud.backup-verifier.owner'],name:a.name,exitCode:a.exitCode,signal:a.signal};
            eventCount++;eventWrites=eventWrites.then(()=>appendFile(eventsPath,JSON.stringify(fixed)+'\n'));
           }catch{eventError='event-parse';}
          });
          let command;
          try{
           const args=process.argv.slice(2);if(!args.length)throw Error('Supply a diagnostic command');
           command=spawn(args[0],args.slice(1),{stdio:'inherit',env:process.env});
           const result=await new Promise((resolve,reject)=>{command.once('error',reject);command.once('close',(code,signal)=>resolve({code,signal}));});
           await writeFile(join(directory,'result.json'),JSON.stringify({result,eventCount,eventError}));
           process.exitCode=result.code??1;
          }finally{
           command?.kill('SIGTERM');events.kill('SIGTERM');const closed=await eventClosed;await eventWrites;
           console.log(JSON.stringify({eventOnlyProbe:directory,eventCount,eventError,eventStreamClosed:closed}));
           if(eventError||!eventCount)process.exitCode=1;
          }
          NODE
          for attempt in 1 2 3; do
            PROBE_OUTPUT=/tmp/d48-boundary/$attempt node /tmp/d48-event-only-probe.mjs node scripts/test-postgres.mjs exec pnpm --dir packages/backups test || exit $?
          done
      - name: Retain bounded Docker diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backup-worker-events
          path: /tmp/d48-boundary/*/*.json*
          retention-days: 7
