name: Backup worker diagnostic
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  packages: read
jobs:
  reproduce:
    if: github.head_ref == 'fix/backup-worker-container-race'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          registry-url: https://npm.pkg.github.com
          scope: '@waitron-io'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: docker build -q -t cloud-verifier-probe -f packages/backups/test/container-fixture/Dockerfile .
      - name: Reproduce with the backup package's normal concurrent tests
        run: |
          for attempt in 1 2 3; do
            echo "PACKAGE ATTEMPT $attempt"
            node scripts/test-postgres.mjs exec pnpm --dir packages/backups test || exit 1
          done
