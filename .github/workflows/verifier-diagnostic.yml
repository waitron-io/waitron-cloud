name: Verifier diagnostic
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  trace:
    if: github.head_ref == 'fix/verifier-heap-refusal'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          package-manager-cache: false
      - name: Trace synthetic heap exhaustion
        run: |
          node scripts/verifier-diagnostic.mjs ../packages/backups/src/verify-process.ts 1
          node scripts/verifier-diagnostic.mjs ../packages/backups/src/verify-process.ts 8
          node --test packages/backups/test/verify-process.test.ts
      - name: Reproduce delayed core collection without changing verifier deadlines
        run: |
          original=$(cat /proc/sys/kernel/core_pattern)
          trap 'printf "%s" "$original" | sudo tee /proc/sys/kernel/core_pattern >/dev/null' EXIT
          printf '#!/bin/sh\nsleep 8\ncat >/dev/null\n' | sudo tee /tmp/d81-core-helper >/dev/null
          sudo chmod 755 /tmp/d81-core-helper
          printf '|/tmp/d81-core-helper' | sudo tee /proc/sys/kernel/core_pattern >/dev/null
          node scripts/verifier-diagnostic.mjs ../packages/backups/src/verify-process.ts 1
          node --test --test-name-pattern='JavaScript allocations' packages/backups/test/verify-process.test.ts
          sleep 8
