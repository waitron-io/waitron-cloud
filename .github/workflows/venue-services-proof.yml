name: Venue service proof
on:
  workflow_call:
    inputs:
      full:
        type: boolean
        default: false
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  packages: read
concurrency:
  group: venue-services-${{ inputs.full && 'nightly-' || '' }}${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ !inputs.full && github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      required: ${{ steps.plan.outputs.required }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          package-manager-cache: false
      - id: plan
        run: node scripts/ci-docs.mjs --plan
        env:
          CI_FORCE_FULL: ${{ inputs.full }}
  service-receipts:
    needs: changes
    if: needs.changes.outputs.required == 'true'
    name: service-receipts (${{ matrix.receipt }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - receipt: legacy
            file: scripts/legacy-service-proof.test.ts
          - receipt: venue
            file: scripts/venue-service-proof.test.ts
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          package-manager-cache: false
      - run: node scripts/ci-setup-pnpm.mjs
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci-pnpm-diagnostics.cjs
          npm_config_fetch_timeout: '15000'
          npm_config_fetch_retries: '1'
          npm_config_fetch_retry_mintimeout: '1000'
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          package-manager-cache: false
          registry-url: https://npm.pkg.github.com
          scope: '@waitron-io'
      - name: Locate pnpm dependency store
        id: pnpm-store
        # The cache version must not depend on the bootstrap's random binary path.
        run: |
          export npm_config_store_dir="$RUNNER_TEMP/cloud-pnpm-store"
          echo "npm_config_store_dir=$npm_config_store_dir" >> "$GITHUB_ENV"
          pnpm_store_path=$(pnpm store path --silent) || exit "$?"
          test -n "$pnpm_store_path" || exit 1
          echo "path=$pnpm_store_path" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm dependency cache
        id: pnpm-cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-node26-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Record proof runner capacity
        run: |
          node -e "const os=require('node:os'),fs=require('node:fs');const read=p=>fs.existsSync(p)?fs.readFileSync(p,'utf8').trim():null;console.log(JSON.stringify({node:process.version,architecture:process.arch,parallelism:os.availableParallelism(),cpus:os.cpus().length,cpuModel:os.cpus()[0]?.model,totalMemory:os.totalmem(),freeMemory:os.freemem(),cpuQuota:read('/sys/fs/cgroup/cpu.max'),memoryLimit:read('/sys/fs/cgroup/memory.max')}));"
      - if: matrix.receipt == 'venue'
        run: node --test --test-reporter=tap scripts/test-cloud-venue-services.test.mjs
      - run: node --test --test-reporter=tap '${{ matrix.file }}'
        env:
          CLOUD_SERVICE_PROOF_TIMINGS: '1'
      # Keep optional saving last so final runner cleanup collects its child processes.
      - name: Save pnpm dependency cache
        if: success() && steps.pnpm-cache.outputs.cache-hit != 'true'
        timeout-minutes: 1
        continue-on-error: true
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: ${{ steps.pnpm-cache.outputs.cache-primary-key }}
