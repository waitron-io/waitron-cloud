name: Venue service proof
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  packages: read
concurrency:
  group: venue-services-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  service-receipts:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          package-manager-cache: false
      - run: node scripts/ci-setup-pnpm.mjs
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci-pnpm-diagnostics.cjs
          npm_config_fetch_timeout: '15000'
          npm_config_fetch_retries: '1'
          npm_config_fetch_retry_mintimeout: '1000'
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@waitron-io'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: node --test --test-reporter=tap scripts/venue-service-proof.test.ts
