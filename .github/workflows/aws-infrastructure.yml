name: AWS infrastructure
on:
  workflow_call:
    inputs:
      full:
        type: boolean
        default: true
      job-prefix:
        type: string
        default: ''
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  actions: read
  pull-requests: read
concurrency:
  # Each main merge needs its own result; an older PR candidate may be cancelled.
  group: aws-infrastructure-${{ inputs.full && 'nightly-' || '' }}${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ !inputs.full && github.event_name == 'pull_request' }}
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      mode: ${{ steps.plan.outputs.mode }}
      required: ${{ steps.plan.outputs.required }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          package-manager-cache: false
      - id: plan
        run: node scripts/ci-native-plan.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_FORCE_FULL: ${{ inputs.full }}
          CI_WORKFLOW_INPUTS: ${{ toJSON(inputs) }}
          CI_RECORD_EVIDENCE: 'true'
          CI_WORKFLOW_PATH: .github/workflows/aws-infrastructure.yml
      - name: Retain source plan
        if: steps.plan.outputs.source_artifact != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.plan.outputs.source_artifact }}
          path: .ci-evidence/source/plan.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Retain main decision
        if: steps.plan.outputs.decision_artifact != ''
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.plan.outputs.decision_artifact }}
          path: .ci-evidence/decision/plan.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  verify:
    needs: changes
    if: needs.changes.outputs.required == 'true'
    name: verify (${{ matrix.cell }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - cell: guards-1
            shard: 1
          - cell: guards-2
            shard: 2
          - cell: guards-3
            shard: 3
          - cell: suites
            shard: 0
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          package-manager-cache: false
      - run: node scripts/ci-setup-pnpm.mjs
        shell: bash
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci-pnpm-diagnostics.cjs
          npm_config_fetch_timeout: '15000'
          npm_config_fetch_retries: '1'
          npm_config_fetch_retry_mintimeout: '1000'
      - name: Check isolated infrastructure plans
        shell: bash
        run: |
          mkdir -p .aws-check-logs
          node deploy/aws/check.mjs --prepare-tools 2>&1 | tee .aws-check-logs/prepare.log
          pnpm --dir deploy/aws install --ignore-workspace --frozen-lockfile 2>&1 | tee .aws-check-logs/install.log
          if [ "${{ matrix.shard }}" != "0" ]; then
            node --test --test-concurrency=1 --test-shard=${{ matrix.shard }}/3 deploy/aws/*.test.mjs 2>&1 | tee .aws-check-logs/guards.log
          else
            node deploy/aws/check.mjs --all 2>&1 | tee .aws-check-logs/suites.log
            docker run --rm --pull never --network none --user 65532:65532 \
              --cap-drop ALL --security-opt no-new-privileges --read-only \
              --memory 256m --cpus 1 --pids-limit 32 \
              --mount "type=bind,source=$PWD/deploy/aws,target=/source,readonly" \
              waitron-cloud-aws-tools:1.13.2-aws6.70.0 \
              tofu fmt -check -recursive /source 2>&1 | tee .aws-check-logs/format.log
          fi
      - name: Retain assertion counts and diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: aws-infrastructure-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_attempt }}-${{ matrix.cell }}
          path: .aws-check-logs/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  summary:
    if: ${{ always() }}
    needs: [changes, verify]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          package-manager-cache: false
      - run: node scripts/ci-native-summary.mjs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CI_PLAN: ${{ needs.changes.outputs.plan }}
          CI_RESULTS: ${{ toJSON(needs) }}
          CI_JOB_PREFIX: ${{ inputs.job-prefix }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          CI_WORKFLOW_INPUTS: ${{ toJSON(inputs) }}
          CI_WORKFLOW_PATH: .github/workflows/aws-infrastructure.yml
