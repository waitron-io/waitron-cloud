name: D201 browser observations
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  packages: read
jobs:
  observe:
    if: github.head_ref == 'fix/browser-reconnect-cause'
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: pnpm/action-setup@v6
        env:
          NODE_OPTIONS: --require=${{ github.workspace }}/scripts/ci-pnpm-diagnostics.cjs
          npm_config_fetch_timeout: '15000'
          npm_config_fetch_retries: '1'
          npm_config_fetch_retry_mintimeout: '1000'
      - uses: actions/setup-node@v5
        with:
          node-version: '26'
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: '@waitron-io'
      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm test:cloud-cost:conformance --only remote-browser-conformance.test.mjs
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
